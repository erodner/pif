[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptinjectorfinder"
version = "0.3.0"
description = "Find hidden and visible prompt-injection patterns in PDF documents"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "tokenizers>=0.15"]
ocr = ["rapidocr-onnxruntime>=1.3"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
pif = "pif.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
