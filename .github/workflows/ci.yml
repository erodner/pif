name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[ml,ocr,gui,dev]"
      - name: Cache ML models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pif-models
          key: pif-models-${{ hashFiles('src/pif/ml/store.py') }}
      - name: Fetch embedding model
        env:
          PIF_MODEL_DIR: ${{ runner.temp }}/pif-models
        run: python scripts/fetch_models.py "${{ runner.temp }}/pif-models" minilm
      - name: Tests
        env:
          PIF_MODEL_DIR: ${{ runner.temp }}/pif-models
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          pif scan tests/fixtures -f json -o report.json --fail-on never -q
          pif scan tests/fixtures/white_text.pdf --ml off --ocr off -q || test $? -eq 1
        shell: bash
