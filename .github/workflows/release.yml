name: Build & release

# Builds the desktop app for macOS (Apple Silicon), Windows (installer + portable zip) and
# Linux (tar.gz), plus the Python sdist/wheel. Every frozen build must pass its self-test.
# Pushing a tag `vX.Y.Z` publishes a GitHub Release; manual runs only upload artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install ".[ml,ocr,gui]" "pyinstaller>=6.10" pillow
      - name: Version
        id: v
        run: |
          VERSION=$(python -c "import pif; print(pif.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $VERSION"; exit 1
          fi
      - name: Cache bundled model
        uses: actions/cache@v4
        with:
          path: build/models
          key: bundled-models-${{ hashFiles('src/pif/ml/store.py') }}
      - name: Fetch bundled model and icon
        run: |
          python scripts/fetch_models.py build/models minilm
          python scripts/make_icon.py build/icon.png
      - name: PyInstaller
        run: pyinstaller --noconfirm --log-level WARN packaging/pif.spec

      - name: Locate build
        id: b
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "cli=dist/Prompt Injection Finder.app/Contents/MacOS/pif" >> "$GITHUB_OUTPUT"
            echo "gui=dist/Prompt Injection Finder.app/Contents/MacOS/Prompt Injection Finder" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "cli=dist/PromptInjectionFinder/pif.exe" >> "$GITHUB_OUTPUT"
            echo "gui=dist/PromptInjectionFinder/PromptInjectionFinder.exe" >> "$GITHUB_OUTPUT"
          else
            echo "cli=dist/PromptInjectionFinder/pif" >> "$GITHUB_OUTPUT"
            echo "gui=dist/PromptInjectionFinder/PromptInjectionFinder" >> "$GITHUB_OUTPUT"
          fi
      - name: Self-test frozen build
        env:
          PIF_MODEL_DIR: ${{ runner.temp }}/no-models  # only bundled models may be used
        run: |
          "${{ steps.b.outputs.cli }}" --selftest
          "${{ steps.b.outputs.gui }}" --smoke-gui

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp "packaging/README-macOS.txt" "dist/Read me first.txt"
          hdiutil create -volname "Prompt Injection Finder" \
            -srcfolder "dist/Prompt Injection Finder.app" -srcfolder "dist/Read me first.txt" \
            -ov -format UDZO "release/PromptInjectionFinder-${{ steps.v.outputs.version }}-${{ matrix.name }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p release
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //Q \
            "//DAppVersion=${{ steps.v.outputs.version }}" \
            "//DSourceDir=$GITHUB_WORKSPACE\\dist\\PromptInjectionFinder" \
            "//DOutputDir=$GITHUB_WORKSPACE\\release" packaging/installer.iss
          (cd dist && 7z a -tzip -mx=7 "../release/PromptInjectionFinder-${{ steps.v.outputs.version }}-${{ matrix.name }}-portable.zip" PromptInjectionFinder >/dev/null)
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/PromptInjectionFinder-${{ steps.v.outputs.version }}-${{ matrix.name }}.tar.gz" PromptInjectionFinder

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  python:
    name: sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [app, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `…-macos-arm64.dmg` (Intel Macs are not supported: ONNX Runtime and PyMuPDF no longer ship Intel builds) |
            | Windows | `…-windows-x64-setup.exe` (installer) or `…-portable.zip` |
            | Linux | `…-linux-x86_64.tar.gz` |
            | Python | `pip install promptinjectorfinder-*.whl` |

            The builds are **not code-signed**. On first launch:
            - **macOS:** open the app once, then go to *System Settings → Privacy & Security* and click **Open Anyway**
              (or run `xattr -dr com.apple.quarantine "/Applications/Prompt Injection Finder.app"`).
            - **Windows:** SmartScreen shows "Windows protected your PC". Click **More info → Run anyway**.

            The command line tool is included: `…/Prompt Injection Finder.app/Contents/MacOS/pif` (macOS),
            `pif.exe` in the install folder (Windows), `PromptInjectionFinder/pif` (Linux).
